# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Testing the repository

on:
  push:
    branches: [ stable/2025.1-m3 ]
  pull_request:

env:
  UPPER_CONSTRAINTS: "https://raw.githubusercontent.com/sapcc/requirements/stable/2025.1-m3/upper-constraints.txt"

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.12]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pbr oslotest -c $UPPER_CONSTRAINTS
        pip install --exists-action w -e git+https://github.com/sapcc/octavia.git@stable/2025.1-m3#egg=octavia -c $UPPER_CONSTRAINTS
        pip install -e . -c $UPPER_CONSTRAINTS
    - name: Test with pytest
      run: |
        pip install pytest -c $UPPER_CONSTRAINTS
        pytest octavia_f5/tests/unit/
